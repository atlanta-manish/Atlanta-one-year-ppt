at Atlanta`,subtitle:"Frontend ownership across RTape, ITMS and VLTD",notes:"I joined Atlanta as a junior frontend developer with internship experience. Over this period, my role expanded into complete frontend ownership, system design, stakeholder demonstrations and supporting other developers. This presentation focuses on the work I contributed and the value it enabled for Atlanta.",source:["personal"]},{id:"at-a-glance",section:"Introduction",label:"Contribution at a glance",layout:"metrics",eyebrow:"YEAR IN REVIEW",title:"Contribution at a glance",subtitle:"Growing responsibility across delivery, architecture and team support",metrics:[{value:"3",label:"Major projects",detail:"RTape, ITMS and VLTD"},{value:"2",label:"People per team",detail:"RTape and ITMS, including me"},{value:"4\u20135",label:"Portals researched",detail:"To shape VLTD requirements"}],takeaway:"RTape secured a government tender following the team\u2019s development and demonstration effort.",footnote:"Team sizes and tender outcome are from my account. The tender is a team achievement.",notes:"My strongest contribution was taking responsibility for frontend delivery in small teams. On RTape and ITMS, the team consisted of two members. For VLTD, I researched four to five existing portals before helping define requirements. The tender win belongs to the project team. My contribution covered frontend delivery, live testing, demonstrations and follow-up support.",source:["personal"]},{id:"responsibility",section:"Introduction",label:"How my responsibility grew",layout:"columns",eyebrow:"PROFESSIONAL GROWTH",title:"How my responsibility grew",subtitle:"I joined as a junior developer with prior internship experience.",items:[{number:"01",title:"RTape",text:"Owned the frontend and shaped workflows with a backend teammate.",detail:"Feature delivery, live testing and demonstrations"},{number:"02",title:"ITMS",text:"Planned the frontend architecture and built operational features end to end.",detail:"System design and permission-heavy workflows"},{number:"03",title:"VLTD",text:"Improved the architecture while supporting a growing frontend team.",detail:"Requirements, mentoring and technical guidance"}],notes:"These projects describe a progression in responsibility, rather than a formal change in job title. RTape developed my ownership of delivery. ITMS gave me greater responsibility for architecture and system design. On VLTD, I combined feature work with requirements, architecture migration, interviews and guidance for other developers. Work on these projects overlapped.",source:["personal"]},{id:"rtape-ownership",section:"RTape",label:"RTape \xB7 Frontend ownership",layout:"project",theme:"dark",eyebrow:"PROJECT 01 / RTAPE",title:"Complete frontend ownership",subtitle:"A management information system for certified reflective-tape fitment and verification",statement:"I owned the frontend across the project\u2019s workflows.",items:[{title:"A two-member team",text:"Built with one backend teammate, with guidance from Ritesh sir."},{title:"Workflow and architecture",text:"Jointly defined feature behavior and integration as requirements evolved."},{title:"Independent problem solving",text:"Used continuous R&D to resolve gaps in documentation and specifications."}],notes:"RTape was my first major project at Atlanta. The system connects manufacturers, fitment centres, transport authorities, inspectors and citizens. I took ownership of the frontend, with initial direction from Ritesh sir and close coordination with my backend teammate. Limited documentation meant I often had to research workflows, clarify requirements and solve technical problems independently, including additional study outside office hours.",source:["personal","rtape"]},{id:"rtape-features",section:"RTape",label:"RTape \xB7 My feature work",layout:"rows",eyebrow:"RTAPE / MY CONTRIBUTIONS",title:"Core workflows I delivered",items:[{title:"Access and governance",text:"Role-aware login, permissions, restricted accounts and approval workflows."},{title:"Appointments and grievances",text:"OTP booking, slots, working hours, complaint tracking and resolution flows."},{title:"Fitment and inventory",text:"Stock allocation, discard flows, price approvals and fitment verification."},{title:"Certificates and usability",text:"QR verification, PDF certificates, Hindi localization and responsive screens."}],takeaway:"Connected public services and operational workflows within the same frontend.",notes:"The supplied RTape review attributes work to me in authentication, complaints, appointments, certificates, localization, inventory workflows and responsive UI. Examples include appointment booking with OTP, complaint lifecycle tracking, inventory discard, OEM price-change approvals, vehicle-fitment verification and public PDF certificates. These capabilities helped make the platform usable for both operational users and citizens.",source:["rtape","personal"]},{id:"rtape-demonstrations",section:"RTape",label:"RTape \xB7 Demonstrations and tender",layout:"outcome",eyebrow:"RTAPE / DELIVERY AND BUSINESS OUTCOME",title:"Delivery beyond the code",result:`Government
tender won`,resultLabel:"PROJECT TEAM OUTCOME",items:[{title:"Live workflow testing",text:"Planned real-world checks and resolved issues from demo feedback."},{title:"Stakeholder demonstrations",text:"Presented at BESIL\u2019s Noida office and joined project demo meetings."},{title:"On-ground demo support",text:"Supported Ritesh sir during the Madhya Pradesh demonstration."},{title:"Follow-through",text:"Helped with documentation and post-demo updates."}],footnote:"Tender outcome and demonstration details are reported in my account.",notes:"My responsibilities extended beyond implementation. I helped prepare and test the full workflow, participated in demo meetings, presented at the Noida office named BESIL in my account, and supported Ritesh sir during the Madhya Pradesh demonstration. The project successfully won the government tender. I describe that as a team achievement and identify my own support clearly. I also helped with documentation and subsequent updates.",source:["personal"]},{id:"rtape-evidence",section:"RTape",label:"RTape \xB7 Contribution evidence",layout:"metrics",eyebrow:"RTAPE / CONTRIBUTION EVIDENCE",title:"A sustained contribution to RTape",subtitle:"Activity attributed to Manish Kumar in the supplied repository review",metrics:[{value:"280",label:"Attributed commits",detail:"Across the reviewed branch\u2019s lifetime"},{value:"89",label:"Commits during 2026",detail:"About 64% of 2026 project commits"},{value:"168",label:"Unique files changed",detail:"During the 2026 review period"}],takeaway:"Feature development continued alongside refactoring, issue resolution and stakeholder changes.",footnote:"Supplied repository snapshot. Commit and file counts describe activity, not production impact.",notes:"These are figures from the supplied repository review, not a fresh audit. The review attributes 280 branch-lifetime commits to Manish Kumar, including 89 during 2026, and changes to 168 unique files in 2026. The 64% share applies only to the project\u2019s 2026 commit activity. It does not describe ownership percentage or business value. I use delivered workflows and the tender milestone to explain the impact alongside this evidence.",source:["rtape"]},{id:"itms-ownership",section:"ITMS",label:"ITMS \xB7 Architecture and delivery",layout:"project",theme:"dark",eyebrow:"PROJECT 02 / ITMS",title:`Architecture and delivery
for transport operations`,subtitle:"A multi-role bus management frontend built by a two-member team",statement:"I planned the frontend and worked on features end to end.",items:[{title:"Requirements and R&D",text:"Planned functional and non-functional requirements for the platform."},{title:"Frontend system design",text:"Designed a maintainable structure and reusable workflow patterns."},{title:"Role-specific operations",text:"Built permission-heavy workflows for different transport users."}],notes:"ITMS broadened my work into frontend system design. With one other team member, I researched requirements, planned the functional and non-functional scope, designed the frontend architecture and worked on features end to end. The platform serves state administration, depot managers and staff, drivers, conductors and passengers. Complex workflows required continuous R&D and coordination with evolving backend APIs.",source:["personal","itms"]},{id:"itms-features",section:"ITMS",label:"ITMS \xB7 Operational workflows",layout:"rows",eyebrow:"ITMS / FEATURE DELIVERY",title:"Operational workflows built end to end",items:[{title:"People and vehicles",text:"Driver and staff management, attendance, permissions, vehicles and device mapping."},{title:"Daily depot operations",text:"Shift templates, rosters, live duties, inventory, fueling and EV chargers."},{title:"Monitoring and support",text:"GPS tracking, incident workflows, evidence, helpdesk tickets and notifications."},{title:"Reports and field portals",text:"Ten operational reports, driver and conductor portals, and public bus information."}],takeaway:"Gave transport users a common frontend for connected daily operations.",notes:"The ITMS scope spans workforce and fleet management, depot resources, shift execution, tracking, incident handling and reporting. The ten-report depot area includes missed shifts, login activity, assignment history, vehicle audit, device health and other operational reports. Driver and conductor portals support field workflows, while the Passenger Information System exposes supported bus, route, stop and trip information. This describes implemented scope, not a claim that every module has completed production hardening.",source:["personal","itms"]},{id:"itms-architecture",section:"ITMS",label:"ITMS \xB7 Maintainable structure",layout:"architecture",eyebrow:"ITMS / ENGINEERING FOUNDATION",title:"An architecture the team can maintain",subtitle:"Clear responsibilities for presentation, state and backend integration",items:[{number:"01",title:"Pages and shared UI",text:"Reusable controls and consistent loading, empty and error states."},{number:"02",title:"Composables and stores",text:"Workflow coordination and state management outside page markup."},{number:"03",title:"API modules and adapters",text:"Named HTTP operations, stable UI models and normalized payloads."}],metrics:[{value:"40",label:"Shared UI components"},{value:"49",label:"Feature API modules"},{value:"36",label:"Response adapters"}],footnote:"Project-wide repository counts from the supplied ITMS review.",notes:"The intent was to make the frontend understandable and maintainable as feature coverage grew. Pages focus on UI, composables coordinate workflows, stores manage state, API modules isolate HTTP calls, and adapters normalize backend responses. The supplied review lists 40 shared UI components, 49 feature API modules and 36 response adapters. These are project-wide scope indicators. I am not claiming a measured performance improvement or a time-saving percentage.",source:["personal","itms"]},{id:"vltd-takeover",section:"VLTD",label:"VLTD \xB7 Taking ownership",layout:"project",theme:"dark",eyebrow:"PROJECT 03 / VLTD",title:`Taking over
an evolving platform`,subtitle:"Vehicle tracking, device lifecycle management and transport compliance",statement:"I combined architecture improvements with feature delivery and team guidance.",items:[{title:"Research before implementation",text:"Reviewed 4\u20135 portals and documented functional and non-functional requirements."},{title:"A clearer architecture",text:"Migrated the existing structure to make the code easier to understand and maintain."},{title:"Continued delivery",text:"Worked on complex flows while resolving questions from junior developers."}],notes:"VLTD was an existing project that I took over. I reviewed four to five portals, created requirements documentation, and documented frontend feature needs. I then improved the existing architecture while continuing feature development. At the same time, I helped new developers understand the workflows and resolved technical doubts. I am describing my stated responsibilities rather than attributing every platform feature to myself.",source:["personal","vltd"]},{id:"vltd-workflows",section:"VLTD",label:"VLTD \xB7 Platform workflows",layout:"rows",eyebrow:"VLTD / PLATFORM SCOPE",title:"Complex workflows across the device lifecycle",items:[{title:"Install and verify",text:"Vehicle validation, device selection, health checks, panic tests and evidence uploads."},{title:"Maintain and replace",text:"Repair workflows, replacement, status history and QR-enabled PDF receipts."},{title:"Monitor and govern",text:"Tracking, alerts, command centres, challans and operational reports."},{title:"Extend role access",text:"Dedicated portals for authorities, OEMs, fitment centres, inspectors and fleet owners."}],takeaway:"My current focus includes RBAC, complex feature work and maintainable shared patterns.",footnote:"Capabilities describe the team\u2019s platform. My ownership is stated separately.",notes:"The platform\u2019s broad scope provides context for the architecture and workflow complexity. The repository review covers installation, health and panic checks, repairs, replacement, tracking, emergency alerts, command centres and compliance reports. These are team-level capabilities. My personal account establishes my role in research, architecture migration, complex feature implementation and ongoing RBAC work. Some portals, dashboards and integrations are still evolving.",source:["vltd","personal"]},{id:"access-control",section:"Engineering",label:"Engineering \xB7 Access control",layout:"columns",eyebrow:"CROSS-PROJECT ENGINEERING",title:"Access control across every portal",subtitle:"Role-based access control is a recurring part of my frontend work.",items:[{number:"01",title:"Routes",text:"Validate the session and user role before opening protected workflows.",detail:"Portal boundaries and login redirects"},{number:"02",title:"Navigation",text:"Show relevant modules according to the user\u2019s assigned permissions.",detail:"Role-aware desktop and mobile menus"},{number:"03",title:"Actions",text:"Apply permission checks to operations within the page.",detail:"Create, update, approve and other actions"}],takeaway:"Frontend controls reflect backend permissions. VLTD RBAC work is ongoing.",notes:"Authentication and permissions recur across all three projects. My frontend responsibility includes routes, navigation and permitted actions. The exact implementation differs by project. Backend authorization remains the security boundary, while the frontend gives users a consistent and appropriate experience. I am currently continuing RBAC work in VLTD, so I do not present the whole access-control programme as finished.",source:["personal","rtape","itms","vltd"]},{id:"team-contribution",section:"Team",label:"Team \xB7 Guidance and collaboration",layout:"rows",eyebrow:"CONTRIBUTION TO THE TEAM",title:"Supporting delivery through people",items:[{title:"Hiring participation",text:"Conducted interviews for senior frontend and intern roles."},{title:"Developer onboarding",text:"Guided new developers through project structure and business workflows."},{title:"Mentoring",text:"Helped an intern and junior members with technical questions and implementation."},{title:"Shared understanding",text:"Created requirements documentation and coordinated workflows with backend teammates."}],takeaway:"My responsibilities expanded to helping other developers move their work forward.",notes:"Alongside implementation, I participated in hiring interviews for senior and intern frontend roles. I guided new developers, mentored an intern and helped junior members resolve technical and workflow questions. I also contributed frontend requirements documentation and coordination with backend teammates. These are examples of increased responsibility, without implying a formal management title or claiming an unmeasured productivity gain.",source:["personal"]},{id:"company-value",section:"Impact",label:"Impact \xB7 Value for Atlanta",layout:"table",eyebrow:"COMPANY IMPACT",title:"What my work enabled for Atlanta",headers:["Project","My contribution","Value enabled"],rows:[["RTape","Frontend ownership, testing, demonstrations and follow-up support","A working platform for stakeholder demos and a contribution to the team\u2019s tender win"],["ITMS","Frontend system design and end-to-end operational features","Connected transport workflows on a reusable frontend foundation"],["VLTD","Requirements, architecture migration, complex flows and mentoring","A clearer structure for continued development across a growing team"]],footnote:"Qualitative value, except the reported tender outcome. No adoption, revenue or time-saving figures are assumed.",notes:"For Atlanta, my contribution has been the ability to take frontend work from ambiguous requirements through implementation and stakeholder review. RTape provides the clearest reported business milestone in the tender win. ITMS enabled broad operational coverage using shared architecture. On VLTD, I have helped improve the structure and supported team delivery. Production adoption, revenue and time-saving metrics were not supplied, so I have not invented them.",source:["personal","rtape","itms","vltd"]},{id:"next-phase",section:"Next phase",label:"Next phase \xB7 Ownership priorities",layout:"rows",eyebrow:"NEXT PHASE / PROPOSED PRIORITIES",title:"Strengthening delivery in the next year",items:[{title:"Complete current workflows",text:"Continue VLTD permissions and close remaining API and dashboard integration gaps."},{title:"Make quality repeatable",text:"Add focused tests for auth, permissions and critical installation workflows."},{title:"Improve maintainability",text:"Continue shared patterns, simplify large pages and document implementation decisions."},{title:"Measure results",text:"Track production usage, reliability and support outcomes with the team."}],takeaway:"Take broader frontend ownership while making delivery easier to sustain.",notes:"These are proposed priorities, not completed achievements. The supplied reviews show opportunities in integration completeness, automated testing, architecture cleanup and production measurement. I would like to take broader ownership of those areas and continue helping other developers. The specific sequence should align with business priorities and backend readiness.",source:["personal","rtape","itms","vltd"]},{id:"scope-reference",section:"Reference",label:"Reference \xB7 Project scale",layout:"table",eyebrow:"REFERENCE / PROJECT-WIDE SCOPE",title:"Repository scale in context",headers:["Project","Source scope","Reusable frontend scope"],rows:[["RTape",`About 340 source files
